<article class="story">
  <h3>{{ s.title }}</h3>
  {% if s.summary %}<p>{{ s.summary }}</p>{% endif %}
  {% if s.why %}<p class="why"><b>Por qué importa:</b> {{ s.why }}</p>{% endif %}
  <p class="src">{% if s.ai %}Fuente{{ 's' if s.sources|length > 1 }}:{% else %}Leer en{% endif %} {% for f in s.sources %}<a href="{{ f.url }}" target="_blank" rel="noopener">{{ f.name }}</a>{{ ", " if not loop.last }}{% endfor %} ↗</p>
</article>

name: Edición semanal

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "templates/**"
      - "static/**"
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Crear la edición semanal
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p data/editions
          python scripts/build.py

      - name: Regenerar la web
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p data/editions
          python scripts/build.py --render

      - name: Guardar la edición en el historial
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vibra-bot"
          git config user.email "vibra-bot@users.noreply.github.com"

          git add data/editions

          if ! git diff --cached --quiet; then
            git commit -m "Edición semanal $(date -u +%G-S%V)"
            git push origin HEAD:main
          else
            echo "No hay cambios nuevos para guardar."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
